name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Fails if any service is priced below what its provider charges.
      # Needs no network or secrets, so it belongs here rather than in a
      # pre-deploy checklist someone can forget.
      - name: Verify pricing covers cost
        run: npm run verify:pricing

      - name: Build
        run: npm run build
